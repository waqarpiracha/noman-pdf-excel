<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4E79">
<title>PDF → Excel</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #f4f6f9; color: #1c2733; }
  header { background: #1F4E79; color: #fff; padding: 18px 16px 14px; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
  main { padding: 16px; max-width: 560px; margin: 0 auto; }
  .card { background: #fff; border-radius: 14px; padding: 18px; margin-bottom: 14px;
          box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .card h2 { margin: 0 0 10px; font-size: 16px; color: #1F4E79; }
  /* Laptop / desktop: wider two-column layout */
  @media (min-width: 900px) {
    main { max-width: 1060px; display: grid; grid-template-columns: 1fr 1fr;
           gap: 16px; align-items: start; }
    .card { margin-bottom: 0; }
    .span2 { grid-column: 1 / -1; }
    header h1 { font-size: 24px; }
    .filelabel { padding: 40px 12px; }
    .filelabel.dragover { background: #d7e7f5; border-color: #163a5c; }
  }
  .bigbtn { display: block; width: 100%; border: none; border-radius: 12px;
            padding: 18px; font-size: 18px; font-weight: 700; color: #fff;
            background: #1F4E79; margin-top: 10px; cursor: pointer; }
  .bigbtn:active { transform: scale(.98); background: #163a5c; }
  .bigbtn.green { background: #1e7e34; }
  .bigbtn.green:active { background: #166026; }
  .bigbtn:disabled { background: #9aa7b4; cursor: default; transform: none; }
  input[type=file] { display: none; }
  .filelabel { display: block; width: 100%; border: 2px dashed #1F4E79; border-radius: 12px;
               padding: 26px 12px; text-align: center; font-size: 17px; font-weight: 600;
               color: #1F4E79; background: #eaf1f8; cursor: pointer; }
  .filelabel small { display: block; margin-top: 6px; font-weight: 400; font-size: 13px; color: #5a6b7c; }
  #progress { height: 10px; background: #e3e9ef; border-radius: 6px; margin-top: 12px; display: none; }
  #progressbar { height: 100%; width: 0%; background: #1F4E79; border-radius: 6px; transition: width .2s; }
  #filelist { list-style: none; margin: 12px 0 0; padding: 0; }
  #filelist li { padding: 10px 4px; border-bottom: 1px solid #eef1f4; font-size: 15px;
                 display: flex; justify-content: space-between; gap: 8px; }
  #filelist li span.fname { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  #filelist li span:last-child { color: #6b7a8a; white-space: nowrap; }
  .rmbtn { border: none; background: #fdecea; color: #b3261e; border-radius: 8px;
           font-size: 15px; font-weight: 700; padding: 4px 10px; cursor: pointer; }
  .rmbtn:active { transform: scale(.95); }
  .refreshbtn { border: 1px solid #1F4E79; background: #eaf1f8; color: #1F4E79;
                border-radius: 8px; font-size: 14px; font-weight: 700;
                padding: 6px 12px; cursor: pointer; float: right; }
  .refreshbtn:active { transform: scale(.96); }
  .card h2 .refreshbtn { margin-top: -4px; }
  #status { font-size: 14px; color: #33414f; min-height: 20px; margin-top: 8px; }
  #download { display: none; text-align: center; }
  #download a { display: inline-block; margin-top: 10px; padding: 16px 28px; font-size: 18px;
                font-weight: 700; color: #fff; background: #1e7e34; border-radius: 12px;
                text-decoration: none; }
  .note { font-size: 13px; color: #6b7a8a; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 3px solid #cdd7e1;
             border-top-color: #1F4E79; border-radius: 50%; animation: spin 0.8s linear infinite;
             vertical-align: -3px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>📄 → 📊 PDF to Excel</h1>
  <p>Upload today's PDFs + dispatch photos, get one formatted Excel.</p>
</header>
<main>
  <div class="card">
    <h2>1 · Upload files</h2>
    <label class="filelabel" for="picker" id="dropzone">📎 Choose PDFs or photos
      <small>Tap to pick from WhatsApp / Files — requirement PDFs or dispatch photos (JPG/PNG) — or drag &amp; drop on a laptop</small>
    </label>
    <input type="file" id="picker" accept="application/pdf,.pdf,image/*,.jpg,.jpeg,.png" multiple>
    <div id="progress"><div id="progressbar"></div></div>
    <div id="status"></div>
  </div>

  <div class="card">
    <h2>2 · Today's files <span id="count" class="note"></span>
      <button class="refreshbtn" id="refreshbtn">↻ Refresh</button></h2>
    <ul id="filelist"><li class="note">Nothing uploaded yet today.</li></ul>
    <div class="note" id="srvmsg" style="margin-top:6px"></div>
  </div>

  <div class="card">
    <h2>3 · Make the Excel</h2>
    <button class="bigbtn green" id="make">⚙️ Make my Excel</button>
    <div id="status2" style="font-size:14px;color:#33414f;min-height:20px;margin-top:8px;"></div>
  </div>

  <div class="card span2" id="download">
    <h2>✅ Ready</h2>
    <p class="note" id="summary"></p>
    <a id="dllink" href="/download">⬇️ Download Excel</a>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const status = t => { $('status').textContent = t; };
const status2 = t => { $('status2').textContent = t; };

function fmtSize(b){ return b > 1048576 ? (b/1048576).toFixed(1)+' MB' : Math.round(b/1024)+' KB'; }

async function refresh(showMsg){
  const msg = t => { $('srvmsg').textContent = t || ''; };
  if (showMsg) msg('Checking server…');
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 25000); // cold start can take ~50s; fail fast with guidance
  try {
    const r = await fetch('/status', {signal: ctrl.signal}); const s = await r.json();
    clearTimeout(timer);
    $('count').textContent = s.uploads ? `(${s.uploads})` : '';
    const f = await (await fetch('/files')).json();
    const ul = $('filelist'); ul.innerHTML = '';
    if (!f.files.length) ul.innerHTML = '<li class="note">Nothing uploaded yet today.</li>';
    f.files.forEach(n => {
      const li = document.createElement('li');
      const a = document.createElement('span'); a.textContent = n; a.className = 'fname';
      const b = document.createElement('span'); b.textContent = fmtSize(f.sizes[n]||0);
      const x = document.createElement('button'); x.textContent = '✕'; x.className = 'rmbtn'; x.title = 'Remove this file';
      x.onclick = () => removeFile(n);
      li.append(a,b,x); ul.appendChild(li);
    });
    if (showMsg) msg(s.ready ? '✅ Server awake — output ready below.' : `✅ Server awake — ${s.uploads || 0} file(s) today.`);
    if (s.ready) showDownload(null);
  } catch(e){
    clearTimeout(timer);
    if (showMsg) msg('😴 Server is waking up (it sleeps when idle) — wait about a minute, then tap ↻ Refresh again.');
  }
}

async function removeFile(n){
  if (!confirm('Remove "' + n + '"?')) return;
  try {
    const r = await fetch('/remove', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({file:n})});
    const j = await r.json();
    if (!j.ok) { status('❌ Could not remove the file.'); return; }
    $('download').style.display = 'none';
  } catch(e){ status('❌ Could not reach server.'); return; }
  refresh();
}

$('refreshbtn').addEventListener('click', () => refresh(true));

function showDownload(info){
  $('download').style.display = 'block';
  $('dllink').href = '/download';
  if (info) {
    let s = `${info.files_processed} PDF(s) → ${info.rows} ledger rows`;
    if (info.aging_rows) s += ` + ${info.aging_rows} aging rows`;
    if (info.raw_files) s += ` + raw extract from ${info.raw_files} unrecognized file(s)`;
    s += `, ${info.columns.length} columns.`;
    if (info.photos_processed) s += ` ${info.photos_processed} photo(s) → ${info.shipments} shipment(s) on the Dispatches sheet.`;
    $('summary').textContent = s;
  }
  $('download').scrollIntoView({behavior:'smooth', block:'nearest'});
}

$('picker').addEventListener('change', e => {
  uploadFiles([...e.target.files]);
  e.target.value = '';
});

// Drag & drop for laptop/desktop: drag PDFs or photos straight from the folder
const dz = $('dropzone');
['dragenter','dragover'].forEach(ev => dz.addEventListener(ev, e => {
  e.preventDefault(); dz.classList.add('dragover');
}));
['dragleave','drop'].forEach(ev => dz.addEventListener(ev, e => {
  e.preventDefault(); dz.classList.remove('dragover');
}));
const OK_EXT = /\.(pdf|jpe?g|png)$/i;
dz.addEventListener('drop', e => {
  const files = [...(e.dataTransfer.files || [])].filter(f => OK_EXT.test(f.name));
  if (files.length) uploadFiles(files);
  else status('Please drop PDF or photo files.');
});

// Shrink huge phone photos before upload: faster on slow networks,
// faster to OCR, and the reader needs no more than ~2200px.
async function shrinkImage(file, maxDim) {
  maxDim = maxDim || 2200;
  if (!file.type || file.type.indexOf('image/') !== 0) return file;
  try {
    const bmp = await createImageBitmap(file, {imageOrientation: 'from-image'});
    const w = bmp.width, h = bmp.height;
    if (Math.max(w, h) <= maxDim) { if (bmp.close) bmp.close(); return file; }
    const s = maxDim / Math.max(w, h);
    const c = document.createElement('canvas');
    c.width = Math.round(w * s); c.height = Math.round(h * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    if (bmp.close) bmp.close();
    const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.85));
    if (!blob) return file;
    const name = file.name.replace(/\.(png|heic|heif|webp|bmp)$/i, '.jpg');
    return new File([blob], name, {type: 'image/jpeg'});
  } catch (e) { return file; } // never break the upload
}

async function uploadFiles(picked) {
  const files = picked.filter(f => OK_EXT.test(f.name));
  if (!files.length) { status('Please choose PDF or photo files.'); return; }
  const shrunk = [];
  for (const f of files) shrunk.push(await shrinkImage(f));
  const fd = new FormData();
  shrunk.forEach(f => fd.append('files', f, f.name));
  const bar = $('progress'), fill = $('progressbar');
  bar.style.display = 'block'; fill.style.width = '0%';
  status(`Uploading ${shrunk.length} file(s)… 0%`);
  try {
    await new Promise((res, rej) => {
      const x = new XMLHttpRequest();
      x.open('POST', '/upload');
      x.timeout = 120000; // 2 min: slow networks should fail loudly, not silently
      x.upload.onprogress = ev => {
        if (ev.lengthComputable) {
          const pc = Math.round(ev.loaded/ev.total*100);
          fill.style.width = pc+'%';
          status(`Uploading ${shrunk.length} file(s)… ${pc}%`);
        }
      };
      x.onload = () => x.status === 200 ? res() : rej(new Error('HTTP '+x.status));
      x.onerror = () => rej(new Error('network'));
      x.ontimeout = () => rej(new Error('timeout'));
      x.send(fd);
    });
    status(`✅ ${shrunk.length} uploaded.`);
    refresh();
  } catch(err){
    status('❌ ' + (err.message === 'timeout'
      ? 'Upload taking too long — check connection and retry.'
      : 'Upload failed — check connection and retry.'));
  }
  finally { setTimeout(()=>{ bar.style.display='none'; }, 800); }
}

$('make').addEventListener('click', async () => {
  const btn = $('make'); btn.disabled = true;
  status2(''); $('make').innerHTML = '<span class="spinner"></span>Working… (photos can take a minute)';
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 300000); // 5 min max
  try {
    const r = await fetch('/process', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}', signal: ctrl.signal});
    const j = await r.json();
    if (!j.ok) { status2('❌ ' + (j.error || 'Processing failed.')); }
    else {
      let msg = `✅ Done — ${j.rows} ledger rows`;
      if (j.aging_rows) msg += ` + ${j.aging_rows} aging rows`;
      if (j.raw_files) msg += ` + ${j.raw_tables} table(s) pulled raw from ${j.raw_files} unrecognized file(s) — check the Raw sheet`;
      msg += ` from ${j.files_processed} PDF(s).`;
      if (j.photos_processed) msg += ` ${j.shipments} shipment(s) from ${j.photos_processed} photo(s).`;
      if (j.notes && j.notes.length) msg += ' Note: ' + j.notes.slice(0,2).join(' · ');
      status2(msg);
      showDownload(j);
    }
  } catch(e){
    status2('❌ ' + (e && e.name === 'AbortError'
      ? 'Taking too long — try fewer files at once.'
      : 'Could not reach server. Try again.'));
  }
  finally { clearTimeout(timer); btn.disabled = false; btn.textContent = '⚙️ Make my Excel'; refresh(); }
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
refresh();
</script>
</body>
</html>
